name: Check production migration drift

# Catches exactly the failure mode that shipped twice: a PR merges and Vercel
# deploys the new code, but nobody remembers to also apply the matching
# Supabase migration(s) to production, so a brand-new feature's tables/RPCs
# don't exist there. This workflow only ever READS production's migration
# history (`supabase migration list`) — it never writes to the database. See
# deploy-db-migrations.yml for the human-triggered fix.
#
# What turns it red (the decision lives in .github/scripts/check-migration-drift.sh):
#  - on main (push / after a deploy / manual): any migration production lacks —
#    "merged, not deployed yet". It re-runs when the deploy workflow finishes,
#    so the red turns green by itself once the migration is applied.
#  - on a pull request: only migrations that main already has but production
#    lacks. The migration a PR itself adds is expected to be missing before the
#    merge — that is a notice and a green check, not an error.
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_run:
    workflows: ['Deploy DB migrations to production']
    types: [completed]
  workflow_dispatch: {}

# Least privilege: read the repo, and read a pull request's changed files.
permissions:
  contents: read
  pull-requests: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref hlkihcerghatdckkqtza

      - name: Compare local migrations against production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/check-migration-drift.sh
